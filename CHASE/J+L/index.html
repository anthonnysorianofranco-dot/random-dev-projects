<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J + L | Nuestro Universo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="starfield"></canvas>

    <main class="container">

        <header>
            <h1>J + L</h1>
            <p class="subtitle">OUR LITTLE UNIVERSE</p>
        </header>

        <section class="counter-section">

            <p class="description">
                Nuestro tiempo juntos
            </p>

            <div class="counter">

                <div class="time-box">
                    <span id="days">000</span>
                    <small>DÍAS</small>
                </div>

                <span class="separator">:</span>

                <div class="time-box">
                    <span id="hours">00</span>
                    <small>HORAS</small>
                </div>

                <span class="separator">:</span>

                <div class="time-box">
                    <span id="minutes">00</span>
                    <small>MINUTOS</small>
                </div>

                <span class="separator">:</span>

                <div class="time-box">
                    <span id="seconds">00</span>
                    <small>SEGUNDOS</small>
                </div>

            </div>

            <p class="start-date">
                Desde el 05 de noviembre de 2026
            </p>

        </section>

        <footer>
            <p>En un universo de infinitas posibilidades,</p>
            <p>coincidimos nosotros.</p>
        </footer>

    </main>

    <script src="js/script.js"></script>
</body>
</html>
